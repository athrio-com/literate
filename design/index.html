<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>loom — programs written to be read</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('loom-theme')
          document.documentElement.setAttribute('data-theme', stored === 'dark' ? 'dark' : 'light')
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light')
        }
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,300&family=Noto+Color+Emoji&display=swap"
      rel="stylesheet"
    />
    <script type="module" src="/src/client.ts"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
